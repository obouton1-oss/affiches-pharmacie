<!doctype html>
<html lang="fr"><head><meta charset="utf-8"></head>
<body style="margin:0;background:transparent">
<script>
"use strict";
// Aperçu des polices : dans les listes de choix, le nom de chaque police est écrit dans cette police.
// Invisible (hauteur nulle) ; ajoute les polices à la page et applique la bonne à chaque nom de police affiché
// dans une liste déroulante. Sans effet (mais sans dégât) si la page parente est inaccessible.
const FICHIERS = {"Montserrat": "Montserrat-Regular.ttf", "Poppins": "Poppins-Regular.ttf", "Lato": "Lato-Regular.ttf",
                  "Open Sans": "OpenSans-Regular.ttf", "Nunito": "Nunito-Regular.ttf", "Oswald": "Oswald-Regular.ttf",
                  "Playfair Display": "PlayfairDisplay-Regular.ttf"};
const FAMILLES = {"Helvetica": 'Helvetica, Arial, "Liberation Sans", sans-serif'};
function post(type, data){ window.parent.postMessage(Object.assign({isStreamlitMessage:true, type}, data||{}), "*"); }

let doc = null;
try{ doc = window.parent.document; doc.body; }catch(e){ doc = null; }

function ecrire(el, nom){
  if(FAMILLES[nom]){ el.style.fontFamily = FAMILLES[nom]; el.dataset.apercuPolice = "1"; }
  else if(el.dataset.apercuPolice){ el.style.fontFamily = ""; delete el.dataset.apercuPolice; }
}

function appliquer(){
  if(!doc) return;
  // listes déroulantes : les noms proposés (anciennes et récentes versions de Streamlit) ...
  for(const el of doc.querySelectorAll('[data-baseweb="select"] *, [data-baseweb="popover"] *, [role="listbox"] *')){
    if(!el.childElementCount && el.tagName !== "INPUT") ecrire(el, (el.textContent || "").trim());
  }
  // ... et le nom choisi, qui s'affiche dans le champ de la liste
  for(const el of doc.querySelectorAll('[data-testid="stSelectbox"] input, [data-baseweb="select"] input')){
    ecrire(el, (el.value || "").trim());
  }
}

if(doc){
  try{
    let css = "";
    for(const [nom, fichier] of Object.entries(FICHIERS)){
      const url = new URL(fichier, location.href).href;
      css += '@font-face{font-family:"apercu ' + nom + '";src:url("' + url + '") format("truetype");font-display:swap}\n';
      FAMILLES[nom] = '"apercu ' + nom + '", sans-serif';
    }
    if(!doc.getElementById("apercu-polices")){
      const style = doc.createElement("style");
      style.id = "apercu-polices"; style.textContent = css;
      doc.head.appendChild(style);
    }
    let attente = false;
    const planifier = () => { if(attente) return; attente = true; requestAnimationFrame(() => { attente = false; appliquer(); }); };
    new MutationObserver(planifier).observe(doc.body, {childList: true, subtree: true, characterData: true,
                                                       attributes: true, attributeFilter: ["value", "aria-expanded"]});
    doc.addEventListener("input", () => setTimeout(appliquer, 50), true);
    doc.addEventListener("click", () => setTimeout(appliquer, 120), true);
    appliquer();
  }catch(e){}
}
window.addEventListener("message", () => {});
post("streamlit:componentReady", {apiVersion: 1});
post("streamlit:setFrameHeight", {height: 0});
</script></body></html>

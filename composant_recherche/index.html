<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<style>
:root{--txt:#1F2430;--bg:#fff;--bg2:#F1F3F7;--prim:#2F6FEB;--gris:#8a8d96;--bord:#d5d8de}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent;font-family:"Source Sans Pro",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--txt)}
#boite{padding:2px 2px 6px}
label{display:block;font-size:14px;margin:0 0 6px}
input{width:100%;font:inherit;font-size:16px;color:var(--txt);background:var(--bg2);border:1px solid transparent;border-radius:8px;padding:10px 12px;outline:none}
input:focus{border-color:var(--prim)}
#liste{margin-top:4px;background:var(--bg);border:1px solid var(--bord);border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.12);overflow:hidden}
.ligne{padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--bg2)}
.ligne:last-child{border-bottom:none}
.ligne.actif{background:var(--bg2)}
.nom{font-weight:700;font-size:15px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.code{font-size:12px;color:var(--gris);line-height:1.3}
.info{padding:8px 12px;font-size:13px;color:var(--gris);font-style:italic}
</style></head>
<body><div id="boite">
<label id="lib" for="q">Produit (nom ou code CIP13 / EAN)</label>
<input id="q" type="text" autocomplete="off" spellcheck="false" placeholder="Saisir les premières lettres, ou un code">
<div id="liste" hidden></div>
</div>
<script>
"use strict";
const MAX = 5, DELAI = 400, MIN_CAR = 3;
const SOURCES_EN_LIGNE = [
  "https://world.openbeautyfacts.org",
  "https://world.openfoodfacts.org"
];
let catalogue = [], enLigne = true, libelle = "";
let resultats = [], actif = -1, attente = false, termine = false;
let minuteur = null, ctrl = null, dejaFocus = false;
const cache = new Map();
const q = document.getElementById("q"), liste = document.getElementById("liste");

function post(type, data){ window.parent.postMessage(Object.assign({isStreamlitMessage:true, type}, data||{}), "*"); }
function hauteur(){ post("streamlit:setFrameHeight", {height: document.getElementById("boite").offsetHeight + 4}); }
// À l'ouverture de la page et à chaque « Nouvelle affiche » : le curseur est déjà dans le champ (sauf écran tactile).
// remonter : après « Nouvelle affiche » / « passer à la suivante », la page remonte aussi pour montrer le champ.
function mettreAuPoint(remonter){
  if(window.matchMedia && window.matchMedia("(pointer: coarse)").matches) return;
  setTimeout(() => {
    try{
      if(remonter && window.frameElement && window.frameElement.scrollIntoView) window.frameElement.scrollIntoView({block: "center", behavior: "smooth"});
    }catch(e){}
    q.focus({preventScroll: true});
  }, 150);
}
function norm(s){ return (s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase(); }
function echapper(s){ return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function rechercheLocale(texte){
  const t = norm(texte).trim();
  if(!t) return [];
  const numerique = /^\d+$/.test(t);
  const mots = t.split(/\s+/);
  const trouves = [];
  for(const [code, nom, marque] of catalogue){
    const n = norm(nom + " " + (marque || ""));
    let score = -1;
    if(numerique){ if(code.startsWith(t)) score = 0; else if(code.includes(t)) score = 1; }
    else if(mots.every(m => n.includes(m))) score = n.startsWith(mots[0]) ? 0 : 1;
    if(score >= 0) trouves.push({code, nom, marque: marque || "", score});
  }
  trouves.sort((a,b) => a.score - b.score || a.nom.localeCompare(b.nom));
  return trouves.slice(0, MAX);
}

async function rechercheEnLigne(texte, signal){
  const cle = norm(texte).trim();
  if(cache.has(cle)) return cache.get(cle);
  const lots = await Promise.all(SOURCES_EN_LIGNE.map(async base => {
    try{
      const url = base + "/cgi/search.pl?search_simple=1&action=process&json=1&page_size=" + MAX +
                  "&fields=code,product_name,product_name_fr,brands&search_terms=" + encodeURIComponent(texte);
      const r = await fetch(url, {signal});
      if(!r.ok) return [];
      const j = await r.json();
      return (j.products||[]).map(p => {
        const marque = (p.brands||"").split(",")[0].trim();
        const lib = (p.product_name_fr || p.product_name || "").trim();
        const nom = (lib && marque && !norm(lib).includes(norm(marque))) ? marque + " " + lib : (lib || marque);
        return {code: String(p.code||""), nom: nom.trim(), marque};
      }).filter(p => /^\d{8,14}$/.test(p.code) && p.nom);
    }catch(e){ if(e.name === "AbortError") throw e; return []; }
  }));
  const fusion = [], vus = new Set();
  for(const p of [].concat(...lots)){ if(!vus.has(p.code)){ vus.add(p.code); fusion.push(p); } }
  cache.set(cle, fusion);
  return fusion;
}

function afficher(){
  let html = "";
  resultats.forEach((r,i) => {
    html += '<div class="ligne' + (i===actif ? " actif" : "") + '" data-i="' + i + '">' +
            '<div class="nom">' + echapper(r.nom) + '</div><div class="code">' + echapper(r.code) + '</div></div>';
  });
  if(attente) html += '<div class="info">Recherche en ligne…</div>';
  else if(termine && !resultats.length && !/^\d+$/.test(q.value.trim())) html += '<div class="info">Aucun résultat</div>';
  liste.innerHTML = html;
  liste.hidden = html === "";
  hauteur();
}

function choisir(item){
  q.value = item.nom || item.code;
  liste.hidden = true; resultats = []; actif = -1;
  post("streamlit:setComponentValue", {value: {code: item.code, nom: item.nom || "", marque: item.marque || "", ts: Date.now()}, dataType: "json"});
  hauteur();
}

function lancer(){
  clearTimeout(minuteur);
  if(ctrl){ ctrl.abort(); ctrl = null; }
  const texte = q.value.trim();
  attente = false; termine = false; actif = -1;
  if(texte.length < 2){ resultats = []; afficher(); return; }
  resultats = rechercheLocale(texte);
  const numerique = /^\d+$/.test(texte);
  if(resultats.length >= MAX || !enLigne || numerique || texte.length < MIN_CAR){ termine = true; afficher(); return; }
  attente = true; afficher();
  minuteur = setTimeout(async () => {
    ctrl = new AbortController();
    try{
      const distants = await rechercheEnLigne(texte, ctrl.signal);
      const codes = new Set(resultats.map(r => r.code));
      for(const p of distants){ if(resultats.length < MAX && !codes.has(p.code)){ resultats.push(p); codes.add(p.code); } }
    }catch(e){ if(e.name === "AbortError") return; }
    attente = false; termine = true; afficher();
  }, DELAI);
}

q.addEventListener("input", lancer);
q.addEventListener("keydown", e => {
  if(e.key === "ArrowDown"){ e.preventDefault(); if(resultats.length){ actif = (actif+1) % resultats.length; afficher(); } }
  else if(e.key === "ArrowUp"){ e.preventDefault(); if(resultats.length){ actif = (actif-1+resultats.length) % resultats.length; afficher(); } }
  else if(e.key === "Escape"){ liste.hidden = true; hauteur(); }
  else if(e.key === "Enter"){
    e.preventDefault();
    const texte = q.value.trim();
    if(actif >= 0) choisir(resultats[actif]);
    else if(/^\d{8,14}$/.test(texte)){ const l = catalogue.find(c => c[0] === texte); choisir({code: texte, nom: l ? l[1] : "", marque: l ? (l[2] || "") : ""}); }
    else if(resultats.length === 1) choisir(resultats[0]);
  }
});
liste.addEventListener("mousedown", e => {
  const l = e.target.closest(".ligne");
  if(l){ e.preventDefault(); choisir(resultats[+l.dataset.i]); }
});
q.addEventListener("focus", () => { if(q.value.trim().length >= 2 && resultats.length) { liste.hidden = false; hauteur(); } });
document.addEventListener("click", e => { if(!e.target.closest("#boite")){ liste.hidden = true; hauteur(); } });

window.addEventListener("message", e => {
  const d = e.data || {};
  if(d.type !== "streamlit:render") return;
  const a = d.args || {};
  catalogue = a.catalogue || [];
  enLigne = a.en_ligne !== false;
  if(a.libelle && a.libelle !== libelle){ libelle = a.libelle; document.getElementById("lib").textContent = libelle; }
  if(a.focus && !dejaFocus){ dejaFocus = true; mettreAuPoint(!!a.remonter); }
  const th = d.theme;
  if(th){
    const r = document.documentElement.style;
    r.setProperty("--txt", th.textColor); r.setProperty("--bg", th.backgroundColor);
    r.setProperty("--bg2", th.secondaryBackgroundColor);
    if(th.primaryColor) r.setProperty("--prim", th.primaryColor);
  }
  hauteur();
});
post("streamlit:componentReady", {apiVersion: 1});
hauteur();
</script></body></html>
